<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>교실 자리 바꾸기</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+KR:wght@400;500;700&family=Jua&display=swap" rel="stylesheet" crossorigin="anonymous">
    <style>
        body {
            font-family: 'Noto+Sans+KR', 'Inter', sans-serif;
            background-color: #fdfbf7; /* 따뜻한 크림색 배경 */
            margin: 0;
            overflow-x: hidden;
        }
        
        .font-jua {
            font-family: 'Jua', sans-serif;
        }

        /* 칠판 텍스처 효과 */
        .chalkboard-texture {
            background-color: #2b4a3c;
            background-image: 
                radial-gradient(#385e4d 15%, transparent 16%),
                radial-gradient(#385e4d 15%, transparent 16%);
            background-size: 10px 10px;
            background-position: 0 0, 5px 5px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.3);
        }

        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            20% { transform: translate(-1px, -1px) rotate(1deg); }
            40% { transform: translate(-2px, 0px) rotate(-1deg); }
            60% { transform: translate(1px, 1px) rotate(0deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            100% { transform: translate(1px, 1px) rotate(0deg); }
        }
        @media print {
            .no-print {
                display: none !important;
            }
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #d6ccc2;
            border-radius: 10px;
            border: 2px solid #fdfbf7;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #c5b8ac;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Chrome, Safari, Edge, Opera: 브라우저 기본 스피너 제거 */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        /* Firefox: 브라우저 기본 스피너 제거 */
        input[type=number] {
            -moz-appearance: textfield;
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "@google/genai": "https://esm.sh/@google/genai@^1.41.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.574.0",
    "html-to-image": "https://esm.sh/html-to-image@^1.11.13"
  }
}
</script>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
</body>
</html>
